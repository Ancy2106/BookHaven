<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Cart | Book Haven</title>
    <link rel="stylesheet" href="Cart.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="padding-top: 100px;">

    <!-- Header / Navbar -->
    <header class="bg-light shadow-sm fixed-top">
        <nav class="navbar navbar-expand-lg navbar-light container">
            <a class="navbar-brand" href="index.html"><img class="logo" src="Images/BookHavenIcon.ico"
                    alt="BookHavenIcon"></a>
            <h1 class="h11">BOOK</h1>
            <h1 class="h12">HAVEN</h1>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="Books.html">Books</a></li>
                    <li class="nav-item"><a class="nav-link" href="About.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="Contact.html">Contact</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="Login.html" id="loginLink">Login</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="Wishlist.html">Wishlist</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="Cart.html">
                            Cart <span id="cartCount" class="badge bg-danger">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="BookHaven.html" onclick="logout()">Logout</a>
                    </li>

                </ul>
            </div>
        </nav>
    </header>

    <div class="container my-5">
        <h2 class="text-center mb-4">🛒 Your Cart</h2>
        <div class="row g-4">
            <!-- Cart Items -->
            <div class="col-12 col-lg-8" id="cartItems"></div>

            <!-- Cart Summary -->
            <div class="col-12 col-lg-4">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-3">Order Summary</h4>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <span id="subtotal">₹0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Shipping</span>
                        <span>₹50</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between fw-bold mb-3">
                        <span>Total</span>
                        <span id="total">₹0</span>
                    </div>
                    <button class="btn btn-primary w-100 mb-2" onclick="checkout()">Proceed to Checkout</button>
                    <a href="Books.html" class="btn btn-outline-secondary w-100">Continue Shopping</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Main.js"></script>
    <script>
        requireLogin();
        loadCart();
    </script>

</body>

</html>

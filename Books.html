<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books | Book Haven</title>
    <link rel="stylesheet" href="Books.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="padding-top: 100px;">

    <!-- Header / Navbar -->
    <header class="bg-light shadow-sm fixed-top">
        <nav class="navbar navbar-expand-lg navbar-light container">
            <a class="navbar-brand" href="Home.html"><img class="logo" src="Images/BookHavenIcon.ico"
                    alt="BookHavenIcon"></a>
            <h1 class="h11">BOOK</h1>
            <h1 class="h12">HAVEN</h1>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="Home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="Books.html">Books</a></li>
                    <li class="nav-item"><a class="nav-link" href="About.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="Contact.html">Contact</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="Login.html" id="loginLink">Login</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="Wishlist.html">Wishlist</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="Cart.html">
                            Cart <span id="cartCount" class="badge bg-danger">0</span>
                        </a>
                    </li>

                </ul>
            </div>
        </nav>
    </header>
    <!-- Books Section -->
    <section class="books container my-5">
        <h2 class="book text-center mb-4">OUR BOOKS</h2>

        <!-- Search & Filter -->
        <div class="container my-4">
            <div class="row g-3">
                <div class="col-md-6">
                    <input type="text" id="searchBox" class="form-control" placeholder="Search books...">
                </div>
                <div class="col-md-3">
                    <select id="categoryFilter" class="form-select">
                        <option value="all">All Categories</option>
                        <option value="Fiction">Fiction</option>
                        <option value="Biography">Biography</option>
                        <option value="Programming">Programming</option>
                        <option value="Motivation">Motivation</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Books Grid -->
        <div class="row books-container g-4 mt-3"></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Main.js">renderBooks();</script>
</body>

</html>

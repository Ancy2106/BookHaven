<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Book Haven</title>
    <link rel="stylesheet" href="Contact.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="padding-top: 100px;">

    <!-- Header / Navbar -->
    <header class="bg-light shadow-sm fixed-top">
        <nav class="navbar navbar-expand-lg navbar-light container">
            <a class="navbar-brand" href="index.html"><img class="logo" src="Images/BookHavenIcon.ico"
                    alt="BookHavenIcon"></a>
            <h1 class="h11">BOOK</h1>
            <h1 class="h12">HAVEN</h1>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="Books.html">Books</a></li>
                    <li class="nav-item"><a class="nav-link" href="About.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="Contact.html">Contact</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="Login.html" id="loginLink">Login</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="Wishlist.html">Wishlist</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="Cart.html">
                            Cart <span id="cartCount" class="badge bg-danger">0</span>
                        </a>
                    </li>

                </ul>
            </div>
        </nav>
    </header>

    <!-- Contact Form -->
    <div class="container my-5">
        <h2 class="touch text-center mb-4">Get in Touch</h2>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form id="contactForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="button btn btn-outline-secondary w-100">Send Message</button>
                </form>
            </div>
        </div>
    </div>


    <!-- CONTACT INFO -->
    <section class="bg-light py-5">
        <div class="container">
            <div class="row text-center shadow-sm">

                <div class="col-md-4 mb-3">
                    <h5>📍 Address</h5>
                    <p>Book Haven, New York</p>
                </div>

                <div class="col-md-4 mb-3">
                    <h5>📧 Email</h5>
                    <p>BookHaven@gmail.com</p>
                </div>

                <div class="col-md-4 mb-3">
                    <h5>📞 Phone</h5>
                    <p>+91 90000 00000</p>
                </div>

            </div>
        </div>
    </section>

    <!-- MAP -->
    <section class="container my-5">
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <h5 class="mb-3">Map</h5>
                <div class="bg-secondary text-white py-5">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d24189.40428448045!2d-73.6664195392699!3d40.725158719029615!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c27d35233e45c5%3A0xee07a487305d599!2sGarden%20City%2C%20NY%2C%20USA!5e0!3m2!1sen!2sin!4v1766467058633!5m2!1sen!2sin"
                        width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </iframe>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <div class="container my-4">
        <div class="footer rounded p-3 text-white">
            <div class="row text-center">

                <div class="col-12 col-md-4">
                    <a href="contact.html" class="footer-link">
                        🔗 Quick Links
                    </a>
                </div>

                <div class="col-12 col-md-4">
                    <a href="contact.html" class="footer-link">
                        💬 Social Icons
                    </a>
                </div>

                <div class="col-12 col-md-4">
                    <a href="contact.html" class="footer-link">
                        📞 Contact Info
                    </a>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Main.js"></script>
</body>

</html>

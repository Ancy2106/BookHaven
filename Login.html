<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Book Haven</title>
    <link rel="stylesheet" href="Login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="padding-top: 100px;">

    <!-- Header / Navbar -->
    <header class="bg-light shadow-sm fixed-top">
        <nav class="navbar navbar-expand-lg navbar-light container">
            <a class="navbar-brand" href="Home.html"><img class="logo" src="Images/BookHavenIcon.ico"
                    alt="BookHavenIcon"></a>
            <h1 class="h11">BOOK</h1>
            <h1 class="h12">HAVEN</h1>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="Books.html">Books</a></li>
                    <li class="nav-item"><a class="nav-link" href="About.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="Contact.html">Contact</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="Login.html" id="loginLink">Login</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="Wishlist.html">Wishlist</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="Cart.html">
                            Cart <span id="cartCount" class="badge bg-danger">0</span>
                        </a>
                    </li>

                </ul>
            </div>
        </nav>
    </header>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4">

                    <h3 class="text-center mb-4">Login</h3>

                    <form onsubmit="event.preventDefault(); loginUser();">

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="loginEmail" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="loginPassword" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Login
                        </button>

                        <p class="mt-3 text-center">
                            Don’t have an account?
                            <a href="SignUp.html">Create one</a>
                        </p>

                    </form>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Main.js"></script>
</body>

</html>
